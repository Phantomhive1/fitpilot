# ============================================================
# FitPilot Nginx 配置（生产推荐方案：前后端同域名，无 CORS）
#
# 用法：
#   1. cp deploy/nginx/fitpilot.conf /etc/nginx/conf.d/fitpilot.conf
#   2. 申请证书：certbot --nginx -d fit.yourdomain.cn
#   3. 把下面 SSL 证书路径改成你自己的，域名改成你的
#   4. nginx -t && nginx -s reload
# ============================================================

# 强制 HTTPS（可选，按需开启）
# server {
#     listen 80;
#     server_name fit.yourdomain.cn;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name fit.yourdomain.cn;   # ← 改成你的域名

    # ── HTTPS 证书（certbot 申请后会自动写入）
    # ssl_certificate     /etc/letsencrypt/live/fit.yourdomain.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fit.yourdomain.cn/privkey.pem;

    # ── 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 前端静态文件（dist/ 目录）
    root /var/www/fitpilot;
    index index.html;

    # 视频姿势分析：图片/视频上传可能到 100MB，必须调大
    client_max_body_size 120m;

    # SPA 路由 fallback（Vue Router 刷新兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源走 nginx 直出，长期缓存（Vue 打包后的 hash 文件名天然支持）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式聊天：必须关掉缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;   # AI 生成计划可能要 1-2 分钟
    }
}